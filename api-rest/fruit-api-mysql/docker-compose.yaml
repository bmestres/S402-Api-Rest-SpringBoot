services:
    # MYSQL DATABASE
    fruit-api-mysql-database:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: psw
            MYSQL_DATABASE: fruit-api-mysql-database
            MYSQL_ROOT_HOST: '%'
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        
    # JAVA APP
    fruit-api:
        build: .
        ports:
            - "9000:9000"
        environment:
            SPRING_DATASOURCE_URL: jdbc:mysql://fruit-api-mysql-database:3306/fruit-api-mysql-database
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: psw
            SPRING_JPA_HIBERNATE_DDL_AUTO: update
volumes:
    mysql-data: