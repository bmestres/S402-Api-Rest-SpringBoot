services:
    # MYSQL DATABASE
    fruit-api-mysql-database:
        image: mysql:8.4
        container_name: mysql-fruit-api-container
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        
    # JAVA APP
    fruit-api:
        build: .
        container_name: java-fruit-api-container
        environment:
            DB_HOST: fruit-api-mysql-database
            DB_PORT: 3306
            DB_NAME: fruit-api-mysql-database
            DB_USER: ${MYSQL_USER}
            DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
volumes:
    mysql-data:
        
